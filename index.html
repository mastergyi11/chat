<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Social Chat</title>
    <style>
        /* ... CSS အကုန်လုံး မူရင်းအတိုင်း ... */
    </style>
</head>
<body>
    <!-- ... HTML အကုန်လုံး မူရင်းအတိုင်း ... -->
    
    <!-- ===== ပြင်ဆင်ထားတဲ့ input ===== -->
    <!-- capture="environment" ကိုဖယ်ပြီး onclick="this.value=null;" ထည့်ထားတယ် -->
    <input id="photoCamera" type="file" accept="image/*" class="hidden" onchange="addPhotoToSlot(event)" onclick="this.value=null;">
    <input id="photoGallery" type="file" accept="image/*" class="hidden" onchange="addPhotoToSlot(event)" onclick="this.value=null;">
    
    <!-- ... ကျန်တဲ့ HTML အကုန်လုံး မူရင်းအတိုင်း ... -->
    
    <script>
        // ===== JavaScript အကုန်လုံး မူရင်းအတိုင်း =====
        // ... ဒါပေမယ့် အောက်ပါ function တွေကို ထည့်ပါ ...
        
        // ===== ပုံရွေးတဲ့အခါ input value ကိုရှင်းပါ =====
        function openCamera() {
            var input = document.getElementById('photoCamera');
            if (input) {
                input.value = '';  // value ကိုရှင်းတယ်
                input.click();
            }
        }
        
        function openGallery() {
            var input = document.getElementById('photoGallery');
            if (input) {
                input.value = '';  // value ကိုရှင်းတယ်
                input.click();
            }
        }
    </script>
</body>
</html>
